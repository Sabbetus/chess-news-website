name: Submit changed articles to IndexNow

on:
  push:
    branches: [main]

# Deliberately no concurrency group shared with deploy.yml's "pages" group
# (and no concurrency block at all): that group's cancel-in-progress used
# to cancel this submission whenever a second push landed on main shortly
# after the first, even after the site had already deployed successfully.
# Each push's own diff is independent, so runs here should never cancel
# each other either -- let them queue and complete in order instead.

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Submit new/changed article URLs to IndexNow
        run: |
          set -euo pipefail

          # Only articles actually added or modified by this push -- a
          # correction to one old article shouldn't re-submit the whole
          # site, and this also naturally covers "new page published"
          # (a brand new file) and "existing page updated" (frontmatter/
          # body edits) the same way.
          changed_files=$(git diff --name-only --diff-filter=ACMR "${{ github.event.before }}" "${{ github.event.after }}" -- 'src/content/articles/*.md' || true)

          if [ -z "$changed_files" ]; then
            echo "No article files changed in this push -- nothing to submit."
            exit 0
          fi

          # A changed article doesn't just mean its own page changed --
          # the front page (lead/latest/grid) and the archive listing
          # always change too, and each article's own lens/continent
          # listing page (and /recaps/, for a recap) changes as well.
          # LENS_SLUGS below must match src/lib/lens.ts's own mapping.
          urls="[]"
          add_url() {
            urls=$(echo "$urls" | jq --arg u "$1" '. + [$u] | unique')
          }
          add_url "https://chessherald.com/"
          add_url "https://chessherald.com/archive/"

          while IFS= read -r file; do
            [ -z "$file" ] && continue
            slug=$(basename "$file" .md)
            add_url "https://chessherald.com/articles/${slug}/"
            echo "Queued article: $slug"

            type=$(grep -oP '^type:\s*"\K[^"]+' "$file" || true)
            if [ "$type" = "recap" ]; then
              add_url "https://chessherald.com/recaps/"
              continue
            fi

            lens=$(grep -oP '^lens:\s*"\K[^"]+' "$file" || true)
            case "$lens" in
              drama) lens_slug="controversy" ;;
              historical-parallel) lens_slug="history" ;;
              money-angle) lens_slug="money" ;;
              community-pulse) lens_slug="community" ;;
              tournament-db) lens_slug="otb-tournaments" ;;
              *) lens_slug="" ;;
            esac
            [ -n "$lens_slug" ] && add_url "https://chessherald.com/lens/${lens_slug}/"

            continent=$(grep -oP '^continent:\s*"\K[^"]+' "$file" || true)
            [ -n "$continent" ] && add_url "https://chessherald.com/continent/${continent}/"
          done <<< "$changed_files"

          count=$(echo "$urls" | jq 'length')
          if [ "$count" -eq 0 ]; then
            echo "Nothing to submit."
            exit 0
          fi

          payload=$(jq -n \
            --arg host "chessherald.com" \
            --arg key "7081e549d516e07f4b446ccbaa83905b" \
            --arg keyLocation "https://chessherald.com/7081e549d516e07f4b446ccbaa83905b.txt" \
            --argjson urlList "$urls" \
            '{host: $host, key: $key, keyLocation: $keyLocation, urlList: $urlList}')

          echo "Submitting $count URL(s) to IndexNow..."
          curl -sS -X POST 'https://api.indexnow.org/indexnow' \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "$payload" \
            -w '\nIndexNow responded: %{http_code}\n'
