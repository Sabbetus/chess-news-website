name: Draft weekly recap

on:
  # Sundays, after that day's daily pipeline run (nominal 02:07 UTC, see
  # pipeline.yml) has had time to land -- still opens a PR for human
  # review, same as the daily pipeline; reviewStatus only flips to
  # "published" on merge.
  #
  # 03:07 UTC nominal, aiming for both this and the daily pipeline's PR to
  # be ready by ~11:00 Finnish time (EEST, UTC+3), when the reviewer wakes
  # up. Like the daily pipeline, this cron has run ~5h late in practice
  # (GitHub deprioritizing scheduled runs on a low-traffic public repo),
  # so 03:07 UTC nominal is aimed at landing around 08:00 UTC actual.
  # :07 rather than :00 avoids the single most contested GitHub Actions
  # scheduling minute.
  schedule:
    - cron: '7 3 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  weekly-recap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          # Full history, not the default shallow depth-1 clone --
          # weekly_recap.py uses each article's own last-commit timestamp
          # (via `git log`) to find exactly which articles went live since
          # the last recap, down to the second rather than the calendar
          # day. A shallow clone would make every file's git log resolve
          # to the same single fetched commit, breaking that entirely.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Draft this week's recap with Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/weekly_recap.py

      - name: Open review PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- src/content/articles/ && [ -z "$(git status --porcelain -- src/content/articles/)" ]; then
            echo "No recap drafted -- nothing to review."
            exit 0
          fi

          # Time included, not just the date -- a date-only branch name
          # collides (non-fast-forward push rejection) if this workflow
          # ever runs twice in the same day, e.g. a manual re-trigger
          # after an earlier run's draft had a bug and never got merged
          # (caught live: 2026-09-20's scheduled run produced a truncated
          # recap that sat unmerged, and the manual re-run after the fix
          # landed failed here for exactly that reason). pipeline.yml and
          # backfill.yml already do this; this workflow was the odd one out.
          BRANCH="drafts/weekly-recap-$(date -u +%Y-%m-%d)-$(date -u +%H%M%S)"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"

          git add src/content/articles/
          git commit -m "chore: weekly recap draft $(date -u +%Y-%m-%d)"
          git push origin "$BRANCH"

          BODY="Automated Weekly Recap draft, synthesized from this week's published articles. Review the body and merge to publish -- see docs/review-workflow.md."
          if [ -s data/weekly-recap-report.md ]; then
            BODY="$BODY"$'\n\n---\n\n'"$(cat data/weekly-recap-report.md)"
          fi

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Weekly recap: $(date -u +%Y-%m-%d)" \
            --body "$BODY" \
            --reviewer Sabbetus
