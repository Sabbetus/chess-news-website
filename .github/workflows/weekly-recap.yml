name: Draft weekly recap

on:
  # Sunday afternoon, after the morning batch has been reviewed and
  # published (user's call, 2026-11-15: a recap drafted at 01:17 UTC ran
  # before Sunday's own pieces were out, and summarised mid-week pieces a
  # later one had overtaken). Several tries an hour apart: the "Wait for
  # the morning batch" step below skips a run while that day's draft PR is
  # still open, and the last try goes ahead regardless. :17 avoids the
  # most contested scheduling minute.
  schedule:
    - cron: '17 11 * * 0'
    - cron: '17 12 * * 0'
    - cron: '17 13 * * 0'
    - cron: '17 14 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  weekly-recap:
    runs-on: ubuntu-latest
    env:
      # Per-run token log for the PR description (scripts/api_usage.py).
      API_USAGE_LOG: /tmp/api-usage.jsonl
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          # Full history, not the default shallow depth-1 clone --
          # weekly_recap.py uses each article's own last-commit timestamp
          # (via `git log`) to find exactly which articles went live since
          # the last recap, down to the second rather than the calendar
          # day. A shallow clone would make every file's git log resolve
          # to the same single fetched commit, breaking that entirely.
          fetch-depth: 0

      - name: Wait for the morning batch
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          # Already drafted this week (an earlier try, or a manual run).
          if git ls-remote --heads origin "drafts/weekly-recap-$TODAY-*" | grep -q . \
             || grep -lq "^publishDate: \"$TODAY\"" $(grep -l '^type: "recap"' src/content/articles/*.md) 2>/dev/null; then
            echo "Recap already drafted today -- skipping."
            echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Manual runs and the last scheduled try go ahead regardless.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date -u +%H)" -ge 14 ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # The morning batch must be published first: no draft PR from
          # today still open, and the daily pipeline has run today.
          if [ -n "$(gh pr list --state open --search "\"Draft batch: $TODAY\" in:title" --json number --jq '.[].number')" ]; then
            echo "Today's draft batch is still open -- waiting for the next try."
            echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! git ls-remote --heads origin "drafts/$TODAY-*" | grep -q .; then
            echo "Today's pipeline hasn't run yet -- waiting for the next try."
            echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "go=true" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.gate.outputs.go == 'true'
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        if: steps.gate.outputs.go == 'true'
        run: pip install -r scripts/requirements.txt

      - name: Draft this week's recap with Claude
        if: steps.gate.outputs.go == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/weekly_recap.py

      - name: Open review PR
        if: steps.gate.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- src/content/articles/ && [ -z "$(git status --porcelain -- src/content/articles/)" ]; then
            echo "No recap drafted -- nothing to review."
            exit 0
          fi

          # Time included, not just the date -- a date-only branch name
          # collides (non-fast-forward push rejection) if this workflow
          # ever runs twice in the same day, e.g. a manual re-trigger
          # after an earlier run's draft had a bug and never got merged
          # (caught live: 2026-09-20's scheduled run produced a truncated
          # recap that sat unmerged, and the manual re-run after the fix
          # landed failed here for exactly that reason). pipeline.yml and
          # backfill.yml already do this; this workflow was the odd one out.
          BRANCH="drafts/weekly-recap-$(date -u +%Y-%m-%d)-$(date -u +%H%M%S)"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"

          git add src/content/articles/
          git commit -m "chore: weekly recap draft $(date -u +%Y-%m-%d)"
          git push origin "$BRANCH"

          BODY="Automated Weekly Recap draft, synthesized from this week's published articles. Review the body and merge to publish -- see docs/review-workflow.md."
          if [ -s data/weekly-recap-report.md ]; then
            BODY="$BODY"$'\n\n---\n\n'"$(cat data/weekly-recap-report.md)"
          fi
          USAGE="$(python scripts/api_usage.py)"
          if [ -n "$USAGE" ]; then
            BODY="$BODY"$'\n\n---\n\n'"$USAGE"
          fi

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Weekly recap: $(date -u +%Y-%m-%d)" \
            --body "$BODY"

          # Separate from pr create so a GitHub API hiccup on the reviewer
          # request can't fail the run after the PR already exists (caught
          # live 2026-10-04: a GraphQL error here marked the recap run failed).
          for attempt in 1 2; do
            gh pr edit "$BRANCH" --add-reviewer Sabbetus && break
            [ "$attempt" = 2 ] && echo "::warning::Could not request review from Sabbetus" || sleep 10
          done
