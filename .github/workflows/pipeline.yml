name: Ingest, select, and draft articles

on:
  # No schedule for now -- run manually (workflow_dispatch) while still
  # reviewing every batch by hand. Add a schedule back once there's enough
  # trust in the pipeline to let it run unattended.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Ingest candidate stories
        run: python scripts/ingest.py

      - name: Select today's stories
        run: python scripts/selection.py

      - name: Draft articles with Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/draft.py

      - name: Open review PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet && git diff --cached --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No changes -- nothing to review today."
            exit 0
          fi

          BRANCH="drafts/$(date -u +%Y-%m-%d)-$(date -u +%H%M%S)"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"

          # data/seen.json and data/candidates.json/selected.json track pipeline
          # state and are useful to review alongside the drafts (shows what was
          # considered and why), so commit them too.
          git add data/ src/content/articles/
          if git diff --cached --quiet; then
            echo "No drafts or state changes to commit."
            exit 0
          fi
          git commit -m "chore: daily draft batch $(date -u +%Y-%m-%d)"
          git push origin "$BRANCH"

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Draft batch: $(date -u +%Y-%m-%d)" \
            --body "Automated draft batch from the ingestion/selection/drafting pipeline. Review each article's frontmatter (source, lens, selectionScore) and body before merging. Merging sets these live once reviewStatus is flipped to \`approved\`/\`published\` -- see docs/review-workflow.md."
