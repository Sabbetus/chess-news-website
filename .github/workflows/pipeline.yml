name: Ingest, select, and draft articles

on:
  # Runs daily; still opens a PR for human review before anything goes
  # live -- reviewStatus only flips to "published" on merge, never
  # automatically. workflow_dispatch stays available for manual/backfill
  # runs alongside the schedule.
  #
  # Nominal time is 4 hours earlier than it looks like it should be: this
  # cron has consistently run ~4.5-6h late in practice (GitHub Actions
  # deprioritizes scheduled runs under load, and a public repo with a
  # handful of daily cron jobs gets queued behind higher-traffic ones).
  # 02:07 UTC -> actual delivery has been landing around 10:00 Finnish
  # time (EEST, UTC+3) rather than the ~14:00 the old 06:00 UTC nominal
  # time produced. :07 rather than :00 also avoids the single most
  # contested scheduling minute, same reasoning as social.yml and
  # weekly-recap.yml.
  schedule:
    - cron: '7 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Ingest candidate stories
        run: python scripts/ingest.py

      - name: Select today's stories
        run: python scripts/selection.py

      - name: Draft articles with Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/draft.py

      - name: Open review PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Only open a PR when there's an actual article to review -- data/
          # (seen.json, candidates.json, selected.json) changes on every run
          # regardless of whether anything was drafted, so checking the full
          # working tree here would open an empty PR on a quiet news day.
          if git diff --quiet -- src/content/articles/ && [ -z "$(git status --porcelain -- src/content/articles/)" ]; then
            echo "No new articles -- nothing to review today."
            exit 0
          fi

          BRANCH="drafts/$(date -u +%Y-%m-%d)-$(date -u +%H%M%S)"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"

          # data/seen.json and data/candidates.json/selected.json track pipeline
          # state and are useful to review alongside the drafts (shows what was
          # considered and why), so commit them too.
          git add data/ src/content/articles/
          git commit -m "chore: daily draft batch $(date -u +%Y-%m-%d)"
          git push origin "$BRANCH"

          # draft.py writes a short report naming anything it failed to
          # draft. Without it in the body, an article lost to a transient
          # API error leaves no trace in front of whoever merges the PR.
          BODY="Automated draft batch from the ingestion/selection/drafting pipeline. Review each article's frontmatter (source, lens, selectionScore) and body before merging. Merging sets these live once reviewStatus is flipped to \`approved\`/\`published\` -- see docs/review-workflow.md."
          if [ -s data/draft-report.md ]; then
            BODY="$BODY"$'\n\n---\n\n'"$(cat data/draft-report.md)"
          fi

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Draft batch: $(date -u +%Y-%m-%d)" \
            --body "$BODY" \
            --reviewer Sabbetus
