name: Post to social media

on:
  # Hourly, at :07 UTC rather than the top of the hour -- GitHub queues
  # scheduled runs against global load, and :00 is the most contested
  # minute. One post per platform per run (user's call, 2026-11-11: hourly
  # posting, with the site rebuild kept to every two hours -- see below).
  # One cron line per hour, not a single '7 * * * *': with the single
  # line GitHub ran the job only every ~6-8 hours (11-12 November: 06:47,
  # 15:53, 22:10), while the old twelve separate lines each got their own
  # slot and ran far more often. Each line is scheduled on its own.
  schedule:
    - cron: '7 0 * * *'
    - cron: '7 1 * * *'
    - cron: '7 2 * * *'
    - cron: '7 3 * * *'
    - cron: '7 4 * * *'
    - cron: '7 5 * * *'
    - cron: '7 6 * * *'
    - cron: '7 7 * * *'
    - cron: '7 8 * * *'
    - cron: '7 9 * * *'
    - cron: '7 10 * * *'
    - cron: '7 11 * * *'
    - cron: '7 12 * * *'
    - cron: '7 13 * * *'
    - cron: '7 14 * * *'
    - cron: '7 15 * * *'
    - cron: '7 16 * * *'
    - cron: '7 17 * * *'
    - cron: '7 18 * * *'
    - cron: '7 19 * * *'
    - cron: '7 20 * * *'
    - cron: '7 21 * * *'
    - cron: '7 22 * * *'
    - cron: '7 23 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
          # No pip cache: this job installs nothing, so the cache step had
          # nothing to save and failed the run once the runner's Python
          # version changed and no older cache was restored (2026-10-06).

      - name: Post pending articles
        id: post
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: python scripts/social_post.py

      - name: Commit updated queue
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/social-queue.json && [ -z "$(git status --porcelain -- data/social-queue.json)" ]; then
            echo "No queue changes."
            exit 0
          fi
          git add data/social-queue.json
          git commit -m "chore: social posting queue update"
          git push

      # Refreshes Most Popular between article pushes -- those can go a
      # couple of days without a new one, but view counts keep changing.
      # deploy.yml already does the whole fetch+commit+build+deploy
      # itself; just dispatch it rather than duplicating that logic here.
      - name: Trigger a site rebuild (refreshes Most Popular)
        env:
          GH_TOKEN: ${{ github.token }}
        # Every two hours only (odd UTC hours, as before the switch to hourly
        # posting); a manual run always rebuilds.
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || [ $(( 10#$(date -u +%H) % 2 )) -eq 1 ]; then
            gh workflow run deploy.yml --ref main
          else
            echo "Even hour: skipping the site rebuild (it runs every two hours)."
          fi

      # Last, so the queue is still committed and the site rebuilt: a failed
      # post fails the run, and GitHub emails a failed scheduled run to the
      # repo owner (user's call, 2026-11-10: Facebook's expired token failed
      # silently for two days because the run still showed green).
      - name: Fail the run if any post failed
        if: steps.post.outputs.failed == 'true'
        run: |
          echo "::error::One or more social posts failed -- see the 'Post pending articles' log (an expired token, most likely)."
          exit 1
