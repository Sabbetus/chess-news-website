name: Build and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_popular_fetch:
        description: >-
          Skip the GA4 fetch below -- set by social.yml's dispatch, which
          already fetched and committed popular.json itself just before
          triggering this run, so fetching again here would just be a
          redundant duplicate API call fetching near-identical data.
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Node
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      # Keyless: exchanges this job's own GitHub OIDC token (the id-token:
      # write permission above) for short-lived Google credentials via
      # Workload Identity Federation. No service-account JSON key exists
      # anywhere -- the org's policy blocks creating those entirely, and
      # this is also just the modern recommended approach regardless.
      # continue-on-error so a not-yet-configured or temporarily-broken
      # provider never blocks the actual site deploy -- fetch_popular.py
      # itself already treats "no usable credentials" as a normal,
      # non-fatal skip.
      - name: Authenticate to Google Cloud
        if: github.event.inputs.skip_popular_fetch != 'true'
        uses: google-github-actions/auth@v2
        continue-on-error: true
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Fetch Most Popular data from GA4
        if: github.event.inputs.skip_popular_fetch != 'true'
        env:
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
        run: python scripts/fetch_popular.py

      - name: Commit updated popular.json
        if: github.event.inputs.skip_popular_fetch != 'true'
        run: |
          # Best-effort like fetch_popular.py itself: a failed/skipped
          # fetch leaves data/popular.json unchanged, so there's often
          # nothing to commit here -- that's normal, not an error.
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/popular.json; then
            echo "No change to data/popular.json."
            exit 0
          fi
          git add data/popular.json
          git commit -m "chore: update most-popular data"
          git push

      - name: Build Astro site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  indexnow:
    needs: deploy
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Submit new/changed article URLs to IndexNow
        run: |
          set -euo pipefail

          # Only articles actually added or modified by this push -- a
          # correction to one old article shouldn't re-submit the whole
          # site, and this also naturally covers "new page published"
          # (a brand new file) and "existing page updated" (frontmatter/
          # body edits) the same way.
          changed_files=$(git diff --name-only --diff-filter=ACMR "${{ github.event.before }}" "${{ github.event.after }}" -- 'src/content/articles/*.md' || true)

          if [ -z "$changed_files" ]; then
            echo "No article files changed in this push -- nothing to submit."
            exit 0
          fi

          urls="[]"
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            slug=$(basename "$file" .md)
            url="https://chessherald.com/articles/${slug}/"
            urls=$(echo "$urls" | jq --arg u "$url" '. + [$u]')
            echo "Queued: $url"
          done <<< "$changed_files"

          count=$(echo "$urls" | jq 'length')
          if [ "$count" -eq 0 ]; then
            echo "Nothing to submit."
            exit 0
          fi

          payload=$(jq -n \
            --arg host "chessherald.com" \
            --arg key "7081e549d516e07f4b446ccbaa83905b" \
            --arg keyLocation "https://chessherald.com/7081e549d516e07f4b446ccbaa83905b.txt" \
            --argjson urlList "$urls" \
            '{host: $host, key: $key, keyLocation: $keyLocation, urlList: $urlList}')

          echo "Submitting $count URL(s) to IndexNow..."
          curl -sS -X POST 'https://api.indexnow.org/indexnow' \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "$payload" \
            -w '\nIndexNow responded: %{http_code}\n'
